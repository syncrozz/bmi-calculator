<!DOCTYPE html>
<html lang="ms">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SYNCROZZ BMI</title>

    <!-- SEO -->
    <meta name="description"
          content="SYNCROZZ BMI - Simple BMI Calculator">

    <meta name="theme-color"
          content="#2563EB">

    <!-- Google Font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/gauge.css">

    <!-- PWA -->
<link rel="manifest"
      href="manifest.json">

<!-- Favicon -->
<link rel="icon"
      type="image/x-icon"
      href="assets/favicon.ico">

<link rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon-32x32.png">

<link rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/favicon-16x16.png">

<link rel="apple-touch-icon"
      sizes="180x180"
      href="assets/favicon-180x180.png">

</head>

<body>

    <main class="container">

        <!-- =====================================================
             HEADER
        ====================================================== -->

        <header class="header">

            <h1>SYNCROZZ BMI</h1>

            <p class="subtitle">
                Simple BMI Calculator
            </p>

        </header>
        
        <!-- =====================================================
             MAIN CARD
        ====================================================== -->

        <section class="card">

            <!-- Gauge -->

            <section class="gauge-card">

                <div class="gauge">

                    <svg class="gauge-svg" viewBox="0 0 220 220">

                        <!-- Background Ring -->

                        <circle
                            class="gauge-bg"
                            cx="110"
                            cy="110"
                            r="90">
                        </circle>

                        <!-- Progress Ring -->

                        <circle
                        class="gauge-progress"
                        id="gaugeProgress"
                        cx="110"
                        cy="110"
                        r="90"
                        pathLength="100">
                        </circle>

                    </svg>

                    <div class="gauge-content">

                        <span class="gauge-label">
                            BMI SCORE
                        </span>

                        <h2 id="bmiValue">
                            Semak
                        </h2>

                        <p id="bmiCategory">
                            BMI Anda
                        </p>

                    </div>

                </div>

                <p id="bmiDescription">
    Masukkan berat dan tinggi untuk mengetahui status BMI anda.
</p>

<!-- BMI Scale -->

<div class="bmi-scale">

    <div class="scale-bar">

        <div
            class="scale-marker"
            id="scaleMarker">
        </div>

    </div>

    <div class="scale-labels">

        <span>18.5</span>

        <span>25</span>

        <span>30</span>

    </div>

    <div class="scale-categories">

        <span>Kurang</span>

        <span>Ideal</span>

        <span>Lebih</span>

        <span>Obes</span>

    </div>

</div>

</section>

            </section>

            <!-- Form -->

            <div class="form-group">

                <label for="weight">
                    Berat (kg)
                </label>

                <input
                    type="number"
                    id="weight"
                    placeholder="Contoh: 70"
                    min="1"
                    max="500"
                    step="0.1">

                    <small
    id="weightError"
    class="input-error">
</small>

            </div>

            <div class="form-group">

                <label for="height">
                    Tinggi (cm)
                </label>

                <input
                    type="number"
                    id="height"
                    placeholder="Contoh: 175"
                    min="50"
                    max="250"
                    step="1">

                    <small
    id="heightError"
    class="input-error">
</small>

            </div>

            <!-- Buttons -->

            <div class="button-group">

                <button id="calculateBtn">
                    Semak BMI
                </button>

                <button id="resetBtn">
                    Reset
                </button>

            </div>

            <footer class="footer">

    <p>Powered by</p>

    <strong>SYNCROZZ</strong>

</footer>

        </section>

    </main>

    <!-- JavaScript -->

    <script src="js/bmi.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/gauge.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
